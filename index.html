<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Előtető 300x100 - 3D nézet</title>
<script type="module" src="model-viewer.min.js"></script>
<style>body{margin:0;font-family:system-ui,sans-serif}model-viewer{width:100%;height:100vh;background:#f4f6f8;--poster-color:transparent}
button[slot=ar-button]{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#b6d44b;color:#222;border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:16px}</style></head><body>
<model-viewer src="eloteto_300x100.glb" alt="Előtető 300x100 cm, szürke keret, áttetsző polikarbonát"
 camera-controls auto-rotate shadow-intensity="1" exposure="0.75" shadow-softness="0.8" environment-image="neutral"
 ar ar-modes="webxr scene-viewer quick-look" ar-placement="wall" ar-scale="fixed" camera-orbit="35deg 70deg auto">
 <button slot="ar-button">Megnézem a falamon (AR)</button></model-viewer></body></html>
